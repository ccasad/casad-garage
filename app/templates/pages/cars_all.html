{% extends "base.html" %}
{% from "partials/icons.html" import icon, empty_state %}
{% block content %}
{% if not cars %}
{{ empty_state("No cars yet", "Use Add a car in the menu at the top right.", "car", "sky") }}
{% else %}
<ul class="grid grid-cols-1 gap-3 sm:grid-cols-2">
  {% for c in cars %}
  <li>
    <form method="post" action="/cars/{{ c.id }}/select" hx-boost="false">
      <button type="submit" class="block min-h-[44px] w-full rounded-xl border border-slate-200 bg-white p-4 text-left dark:border-slate-800 dark:bg-slate-900">
        <span class="block truncate font-semibold">{{ c.name }}</span>
        <span class="block truncate text-sm text-slate-500 dark:text-slate-400">{{ c.subtitle }}{% if c.color %} · {{ c.color }}{% endif %}</span>
      </button>
    </form>
  </li>
  {% endfor %}
</ul>
{% endif %}
{% endblock %}
