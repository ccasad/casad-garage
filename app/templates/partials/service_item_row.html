{#- One item row of the service form. `item` may be None for the blank template row. -#}
<div data-item-row class="space-y-2 rounded-lg border border-slate-200 p-3 dark:border-slate-700">
  <input type="hidden" name="item_id" value="{{ item.id if item else '' }}">
  <div>
    <label class="mb-1 block text-sm font-medium">Description</label>
    <input name="item_description" value="{{ item.description if item else '' }}" maxlength="200" autocomplete="off"
           class="min-h-[44px] w-full rounded-lg border border-slate-300 bg-white px-3 text-base dark:border-slate-700 dark:bg-slate-900">
  </div>
  <div class="grid grid-cols-2 gap-2">
    <div>
      <label class="mb-1 block text-sm font-medium">Type</label>
      <select name="item_type" class="min-h-[44px] w-full rounded-lg border border-slate-300 bg-white px-3 text-base dark:border-slate-700 dark:bg-slate-900">
        {% for key, label in service_types %}<option value="{{ key }}" {% if item and item.type == key %}selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium">Cost ($)</label>
      <input name="item_cost" value="{{ item.cost if item else '' }}" inputmode="decimal" autocomplete="off"
             class="min-h-[44px] w-full rounded-lg border border-slate-300 bg-white px-3 text-base dark:border-slate-700 dark:bg-slate-900">
    </div>
  </div>
  <div>
    <label class="mb-1 block text-sm font-medium">Part or brand</label>
    <input name="item_part" value="{{ item.part if item else '' }}" maxlength="120" autocomplete="off"
           class="min-h-[44px] w-full rounded-lg border border-slate-300 bg-white px-3 text-base dark:border-slate-700 dark:bg-slate-900">
  </div>
  <button type="button" data-remove-row class="min-h-[44px] text-sm font-medium text-red-600 dark:text-red-400">Remove item</button>
</div>
